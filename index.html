<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Draft Anything</title>
<meta name="description" content="Draft anyone into any sport: NBA legends, Marvel, cartoons and Muppets. Fan-cast a lineup, chase a perfect season, or draft head-to-head with a friend.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
html,body{margin:0}
/* Layout concept: a coach's tactics board — painted playing surfaces with magnetic player tokens, framed by a broadcast draft card. */
:root {
  --bg: #EEF2EF; --panel: #FFFFFF; --panel2: #F6F8F6; --ink: #12201A; --muted: #56665D; --line: #D3DCD6;
  --accent: #E5A00F; --accent-strong: #9A6500; --accent-ink: #1C1406; --you: #2253D1; --opp: #CF4529;
  --good: #1B8A4B; --warn: #B57C06; --bad: #C0382A; --focus: #2253D1;
  --wood: #DDAC72; --wood2: #D29F63; --paint: #2E5BC8; --hoop: #E8642A; --chalk: #FFFFFF;
  --turf: #2E8A4F; --turf2: #297D47; --los: #3E7BFA; --first: #F5D33A; --dirt: #C68456; --wall: #1F5233;
  --ice: #F1F7FA; --boards: #9FB3BF; --rink-red: #D2383A; --rink-blue: #2B5FC2; --crease: #BFD8F2;
  --vb: #E07A3E; --vb-free: #2D7F8E; --net: #1B2B33; --post: #E9EEF0;
  --pit: #B98F5E; --pit-out: #3A2F28; --pit-ring: #6B5446;
  --shadow: 0 1px 2px rgba(18,32,26,.08), 0 6px 18px rgba(18,32,26,.08);
  --f-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1411; --panel: #151E19; --panel2: #1A2520; --ink: #E5EDE8; --muted: #93A39A; --line: #26342D;
  --accent: #F2B33A; --accent-strong: #F2B33A; --accent-ink: #1C1406; --you: #6E95FF; --opp: #FF7B5E;
  --good: #4CC27F; --warn: #E7B13E; --bad: #F06A55; --focus: #8FB0FF;
  --wood: #B98A55; --wood2: #AE7F4B; --paint: #2A4FA8; --turf: #23703F; --turf2: #1F6639; --dirt: #A86E46; --wall: #123822;
  --ice: #DCE7EC; --boards: #6F8592; --vb: #C2662F; --vb-free: #23646F; --pit: #94704A; --pit-out: #241D18; --pit-ring: #54423A;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0D1411; --panel: #151E19; --panel2: #1A2520; --ink: #E5EDE8; --muted: #93A39A; --line: #26342D;
  --accent: #F2B33A; --accent-strong: #F2B33A; --accent-ink: #1C1406; --you: #6E95FF; --opp: #FF7B5E;
  --good: #4CC27F; --warn: #E7B13E; --bad: #F06A55; --focus: #8FB0FF;
  --wood: #B98A55; --wood2: #AE7F4B; --paint: #2A4FA8; --turf: #23703F; --turf2: #1F6639; --dirt: #A86E46; --wall: #123822;
  --ice: #DCE7EC; --boards: #6F8592; --vb: #C2662F; --vb-free: #23646F; --pit: #94704A; --pit-out: #241D18; --pit-ring: #54423A;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; font-size: max(16px, 1em); }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.app { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 48px; }

/* Header */
.top { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding-block: 6px 14px; border-bottom: 2px solid var(--ink); margin-bottom: 18px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(30px, 5vw, 44px); letter-spacing: .01em; line-height: .9; margin: 0; text-transform: uppercase; }
.brand h1 em { font-style: normal; color: var(--accent); -webkit-text-stroke: 0; }
.brand small { font-family: var(--f-mono); font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.modes { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.modes button { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.linkish { border: 0; background: none; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 13px; padding: 4px; }

/* Generic */
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
h2.h { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; font-size: 26px; line-height: 1; margin: 0 0 4px; letter-spacing: .01em; text-wrap: balance; }
h3.h { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; font-size: 19px; line-height: 1.05; margin: 0; letter-spacing: .02em; }
.muted { color: var(--muted); }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 9px 14px; font-weight: 600; font-size: 14px; }
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.05); border-color: var(--accent); }
.btn.dark { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.big { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; font-size: 20px; letter-spacing: .03em; padding: 12px 22px; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.note { font-size: 13px; color: var(--muted); }
.err { color: var(--bad); font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 14px; }
.field-label { display: grid; gap: 5px; font-size: 13px; font-weight: 600; }
.field-label > span { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
input[type=text], select { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; min-width: 0; width: 100%; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--line); background: var(--panel2); padding: 6px 11px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Setup */
.setup { display: grid; gap: 22px; }
.step { display: grid; gap: 10px; }
.step-head { display: flex; align-items: baseline; gap: 10px; }
.step-head .n { font-family: var(--f-display); font-weight: 900; font-size: 30px; line-height: .8; color: var(--accent); }
.sports { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.sport { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 12px; display: grid; gap: 6px; position: relative; overflow: hidden; }
.sport .glyph { color: var(--muted); }
.sport b { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; font-size: 21px; line-height: 1; letter-spacing: .02em; }
.sport span { font-size: 12.5px; color: var(--muted); }
.sport[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.sport[aria-pressed="true"] .glyph { color: var(--accent); }
.sport .mini { position: absolute; right: -14px; bottom: -14px; width: 74px; opacity: .22; transform: rotate(-8deg); border-radius: 6px; overflow: hidden; pointer-events: none; }
.pools { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.pool { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 3px; }
.pool b { font-weight: 700; font-size: 15.5px; }
.pool span { font-size: 12.5px; color: var(--muted); }
.pool .faces { display: flex; gap: 2px; margin-top: 6px; }
.pool .faces .mini-tk { width: 24px; height: 24px; display: block; }
.pool[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.pool.gen { border-style: dashed; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 18px; padding: 16px; }
.cta-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

/* Draft board */
.board-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 14px; }
.board-head .title { margin-right: auto; display: grid; gap: 2px; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 600; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.board { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .board { grid-template-columns: minmax(0, 1.2fr) minmax(330px, 1fr); align-items: start; } }
.board.h2h { grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1000px) { .board.h2h { grid-template-columns: minmax(0, 1fr) minmax(0, .8fr) minmax(320px, .95fr); } }

.field-wrap { container-type: inline-size; display: grid; gap: 10px; min-width: 0; }
.field { position: relative; width: 100%; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); background: var(--turf); }
.field .surface { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.node { position: absolute; transform: translate(-50%, -50%); border: 0; background: none; padding: 0; display: grid; justify-items: center; gap: 2px; --d: clamp(30px, 10.5cqw, 58px); z-index: 1; }
.dense .node { --d: clamp(26px, 8.2cqw, 46px); }
.node .disc { width: var(--d); height: var(--d); border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: calc(var(--d) * .36); letter-spacing: .02em; background: rgba(255,255,255,.18); border: 2px dashed rgba(255,255,255,.85); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35); transition: transform .15s ease; }
.node.filled .disc { background: none; border: 0; border-radius: 0; filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
.node.filled .disc, .side-node.filled .disc { position: relative; }
.node.filled .disc .tk, .side-node.filled .disc .tk { position: absolute; width: 126%; height: 126%; left: -13%; top: -13%; }
.node .tag { font-size: clamp(9px, 2.2cqw, 12px); font-weight: 700; color: #fff; background: rgba(12,20,16,.72); padding: 1px 6px; border-radius: 4px; white-space: nowrap; max-width: calc(var(--d) * 2.6); overflow: hidden; text-overflow: ellipsis; line-height: 1.35; }
.dense .node .tag { font-size: clamp(8px, 1.9cqw, 11px); max-width: 9.2cqw; }
.node:hover .disc, .node.active .disc { transform: scale(1.08); }
.node.active .disc { border-color: var(--accent); border-style: solid; box-shadow: 0 0 0 3px var(--accent); }
.node.filled.active .disc { box-shadow: none; filter: drop-shadow(0 0 2px var(--accent)) drop-shadow(0 0 3px var(--accent)); }
.node.filled.forced .disc { animation: none; }
.node.forced .disc { border-color: var(--accent); border-style: solid; animation: pulse 1.4s ease-in-out infinite; }
.node[disabled] { cursor: default; }
.node .gr { position: absolute; top: -4px; right: -8px; font-family: var(--f-mono); font-size: 10px; font-weight: 600; background: var(--panel); color: var(--ink); border-radius: 5px; padding: 0 4px; box-shadow: var(--shadow); }
@container (max-width: 420px) { .dense .node .tag .nm { display: none; } }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px rgba(229,160,15,.45); } }
@media (prefers-reduced-motion: reduce) { .node .disc { transition: none; } .node.forced .disc { animation: none; } }
.sideline { display: flex; flex-wrap: wrap; gap: 8px; }
.side-node { display: flex; align-items: center; gap: 10px; border: 1px dashed var(--line); background: var(--panel); border-radius: 10px; padding: 7px 12px 7px 7px; text-align: left; min-width: 0; flex: 1 1 200px; }
.side-node .disc { width: 38px; height: 38px; flex: none; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 15px; border: 2px dashed var(--muted); color: var(--muted); }
.side-node.filled { border-style: solid; }
.side-node.filled .disc { border: 0; border-radius: 0; filter: drop-shadow(0 1px 2px rgba(0,0,0,.3)); }
.side-node.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.side-node.forced { border-color: var(--accent); border-style: solid; }
.side-node .lbl { display: grid; min-width: 0; }
.side-node .lbl b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-node .lbl small { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.side-node .gr { margin-left: auto; font-family: var(--f-mono); font-size: 12px; font-weight: 600; }

/* Picker panel */
.picker { display: grid; grid-template-rows: auto auto minmax(0, 1fr); max-height: min(78vh, 760px); min-height: 360px; overflow: hidden; }
.picker-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.picker-head .row { justify-content: space-between; flex-wrap: nowrap; }
.needs { display: flex; flex-wrap: wrap; gap: 5px; }
.needs span { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 7px; }
.picker-tools { padding: 10px 16px; display: flex; gap: 8px; border-bottom: 1px solid var(--line); }
.plist { overflow-y: auto; padding: 6px; display: grid; align-content: start; gap: 2px; }
.cand { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 10px; align-items: center; border: 0; background: none; border-radius: 8px; padding: 6px 8px; text-align: left; width: 100%; }
.cand:hover:not(:disabled) { background: var(--panel2); }
.cand:disabled { opacity: .4; cursor: not-allowed; }
.av { width: 38px; height: 38px; border-radius: 9px; display: block; background: var(--panel2); border: 1px solid var(--line); padding: 2px; flex: none; }
.cand .who { display: grid; min-width: 0; }
.cand .who b { font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cand .who small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cand .meta { font-family: var(--f-mono); font-size: 12px; text-align: right; }
.fitpill { display: inline-block; min-width: 40px; text-align: center; border-radius: 6px; padding: 2px 6px; font-family: var(--f-mono); font-weight: 600; font-size: 12px; }
.tone-great { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.tone-good { background: color-mix(in srgb, var(--good) 10%, transparent); color: var(--good); }
.tone-meh { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.tone-bad { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.roster-list { display: grid; gap: 0; padding: 4px 0; }
.rl { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); border-left: 0; border-right: 0; border-top: 0; background: none; text-align: left; width: 100%; }
.rl:last-child { border-bottom: 0; }
.rl .ab { font-family: var(--f-display); font-weight: 800; font-size: 17px; color: var(--muted); }
.rl .who { min-width: 0; display: grid; }
.rl .who b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.rl .who small { color: var(--muted); font-size: 12px; }
.rl.empty .who b { color: var(--muted); font-weight: 500; }
.sheet-backdrop { display: none; }
@media (max-width: 899px) {
  .picker.open { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; border-radius: 16px 16px 0 0; max-height: 78vh; min-height: 50vh; padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -10px 40px rgba(0,0,0,.35); }
  .sheet-backdrop.open { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 29; }
}

/* Results */
.result-hero { display: grid; gap: 6px; padding: 22px 20px; border-radius: 14px; background: var(--ink); color: var(--bg); position: relative; overflow: hidden; }
.result-hero .big { font-family: var(--f-display); font-weight: 900; text-transform: uppercase; font-size: clamp(38px, 8vw, 72px); line-height: .88; letter-spacing: .01em; text-wrap: balance; }
.result-hero .big em { font-style: normal; color: var(--accent); }
.result-hero p { margin: 0; max-width: 62ch; opacity: .85; }
.scorebug { display: inline-flex; align-items: stretch; border-radius: 8px; overflow: hidden; font-family: var(--f-display); font-weight: 800; text-transform: uppercase; margin-top: 6px; max-width: 100%; flex-wrap: wrap; }
.scorebug > div { padding: 6px 12px; display: flex; gap: 10px; align-items: center; font-size: 20px; }
.scorebug .t1 { background: var(--you); color: #fff; }
.scorebug .t2 { background: var(--opp); color: #fff; }
.scorebug .s { font-family: var(--f-mono); font-weight: 600; font-size: 20px; }
.scorebug .x { background: var(--accent); color: var(--accent-ink); font-size: 13px; }
.res-grid { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); margin-top: 18px; align-items: start; }
@media (min-width: 960px) { .res-grid { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); } }
.tbl-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.t th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t td.n, table.t th.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tr.me td { background: color-mix(in srgb, var(--you) 9%, transparent); font-weight: 600; }
.pname { display: flex; align-items: center; gap: 8px; min-width: 0; }
.pname .av { width: 30px; height: 30px; padding: 1px; border-radius: 7px; }
.ab-cell { font-family: var(--f-display); font-weight: 800; font-size: 15px; color: var(--muted); white-space: nowrap; }
.bars { display: flex; gap: 3px; align-items: flex-end; height: 22px; }
.bars i { display: block; width: 7px; border-radius: 2px 2px 0 0; background: var(--muted); opacity: .8; }
.bars i.k { background: var(--accent); opacity: 1; }
.sec { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.bracket { display: grid; gap: 10px; padding: 14px 16px; }
.bracket .rnd { display: grid; gap: 6px; }
.game { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); font-size: 13.5px; }
.game .w { font-weight: 700; }
.game .l { color: var(--muted); }
.game .sc { font-family: var(--f-mono); text-align: right; }
.game .xtra { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); font-family: var(--f-mono); }
.game.me { border-color: var(--you); }
details.team { border-bottom: 1px solid var(--line); }
details.team summary { padding: 10px 16px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; font-weight: 600; }
details.team .roster-mini { padding: 0 16px 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 4px 12px; font-size: 13px; }
details.team .roster-mini span { display: flex; align-items: center; min-width: 0; white-space: nowrap; }
details.team .roster-mini span b { font-family: var(--f-display); color: var(--muted); margin-right: 6px; min-width: 22px; }

function sigOf(rows) {
  let lift = 0, chaos = 0; const list = [], spark = [];
  rows.forEach((r, i) => {
    const c = r.cand; if (!c) return;
    if (c.sig) {
      list.push({ i, c, name: c.sig.name, kind: c.sig.kind });
      if (c.sig.kind === 'lift') lift += SIG.lift;
      if (c.sig.kind === 'chaos') chaos += SIG.chaos;
    }
    const clutch = !!(c.sig && c.sig.kind === 'clutch');
    if (c.boom || clutch) spark.push({ i, w: r.w, boom: !!c.boom, clutch });
  });

}

// Ratings for one game. Chaos applies every game; clutch and boom only in the playoffs.
function gameRatings(A, B, playoff, rng) {
  let ra = A.rating - ((B.sig && B.sig.chaos) || 0), rb = B.rating - ((A.sig && A.sig.chaos) || 0);
  const ev = [];
  if (playoff) for (const [T, side] of [[A, 0], [B, 1]]) for (const x of (T.sig && T.sig.spark) || []) {
    let d = 0;
    if (x.clutch) { d += SIG.clutch * x.w; ev.push({ side, i: x.i, kind: 'clutch' }); }
    if (x.boom) {
      const u = rng();
      if (u < BOOM.p) { d += BOOM.up * x.w; ev.push({ side, i: x.i, kind: 'boom' }); }
      else if (u > 1 - BOOM.bust) { d -= BOOM.down * x.w; ev.push({ side, i: x.i, kind: 'bust' }); }
    }
    if (side === 0) ra += d; else rb += d;
  }
  return { ra, rb, ev };
}

  return { n: best.length, picks: best, pts: VARIETY_PTS[Math.min(5, best.length)] };
}

const UPSET_SIGMA = { off: 0, low: 2.5, high: 6 };

function playGame(sportKey, A, B, sigma, rng, playoff = false) {

// Sport-flavored final score for a game won by `margin` rating points. Returns [winnerScore, loserScore, note]
function scoreline(sportKey, margin, avg, r) {

      const diff = Math.max(1, Math.round(margin * 1.4 + ri(0, 5)));

    }
    case 'football': {

      const steps = [1, 2, 3, 4, 3, 7, 6, 7, 10, 11, 14, 17, 21, 24, 28];
      const d = steps[Math.min(steps.length - 1, Math.round(margin * 0.9) + ri(0, 3))];
      return [L + d, L, ''];
    }
    case 'soccer': {
      const d = Math.max(1, Math.min(4, Math.round(margin / 6) + (r() < 0.35 ? 1 : 0)));
      const L = margin < 6 ? ri(0, 2) : ri(0, 1);
      if (margin < 1.2 && r() < 0.5) return [L, L, 'won on penalties'];
      return [L + d, L, ''];
    }
    case 'hockey': {
      const d = Math.max(1, Math.min(5, Math.round(margin / 5) + (r() < 0.3 ? 1 : 0)));
      const L = ri(0, 3);
      return [L + d, L, d === 1 && margin < 2 ? (r() < 0.5 ? 'OT' : 'SO') : ''];
    }
    case 'baseball': {
      const d = Math.max(1, Math.min(9, Math.round(margin / 3) + ri(0, 2)));
      const L = ri(0, 5);
      return [L + d, L, d === 1 && margin < 1.5 && r() < 0.4 ? 'walk-off' : ''];
    }
    case 'volleyball': {
      const lost = margin > 8 ? 0 : margin > 3 ? 1 : 2;
      const sets = [];
      const total = 3 + lost;
      // place lost sets somewhere before the final set
      const lostIdx = new Set(); while (lostIdx.size < lost) lostIdx.add(ri(0, total - 2));
      for (let i = 0; i < total; i++) {
        const to = i === 4 ? 15 : 25;
        const close = margin < 4;
        let lo = to - (close ? ri(2, 5) : ri(4, 11));
        let hi = to;
        if (close && r() < 0.3) { hi = to + ri(1, 4); lo = hi - 2; }
        sets.push(lostIdx.has(i) ? [lo, hi] : [hi, lo]);
      }
      return [3, lost, sets.map(s => s.join('-')).join(', ')];
    }
    case 'brawl': {

// Full championship: round robin then a seeded playoff bracket.
function simChampionship(sportKey, teams, sigma, rng) {
  // teams: [{ name, roster, score:{rating,...}, user? }]
  const n = teams.length;
  const rec = teams.map(() => ({ w: 0, l: 0, pf: 0, pa: 0 }));
  const games = [];
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
    const g = playGame(sportKey, teams[i].score, teams[j].score, sigma, rng);
    const [W, L] = g.winner === 0 ? [i, j] : [j, i];
    rec[W].w++; rec[L].l++;
    rec[W].pf += g.line[0]; rec[W].pa += g.line[1]; rec[L].pf += g.line[1]; rec[L].pa += g.line[0];
    games.push({ a: i, b: j, w: W, line: g.line, m: g.margin });
  }
  const standings = teams.map((t, i) => ({ i, ...rec[i] }))
    .sort((x, y) => y.w - x.w || (y.pf - y.pa) - (x.pf - x.pa) || teams[y.i].score.rating - teams[x.i].score.rating);
  const nPlay = n >= 8 ? 8 : 4;
  const seeds = standings.slice(0, nPlay).map(s => s.i);
  const pairs = nPlay === 8 ? [[0, 7], [3, 4], [2, 5], [1, 6]] : [[0, 3], [1, 2]];
  let round = pairs.map(([a, b]) => [seeds[a], seeds[b]]);
  const rounds = [];
  while (true) {
    const res = round.map(([a, b]) => { const g = playGame(sportKey, teams[a].score, teams[b].score, sigma, rng, true); return { a, b, w: g.winner === 0 ? a : b, line: g.line, m: g.margin, bo: 1, ev: g.ev.map(e => ({ ...e, team: e.side === 0 ? a : b, g: 1 })) }; });
    rounds.push(res);
    if (res.length === 1) break;
    const next = [];
    for (let k = 0; k < res.length; k += 2) next.push([res[k].w, res[k + 1].w]);
    round = next;
  }
  const champ = rounds[rounds.length - 1][0].w;
  return { standings, rounds, champ, games, seeds };
}

// Head-to-head: deterministic per contest seed
function simH2H(sportKey, scoreA, scoreB, upsets, seed) {
  const r = rngFrom(seed + ':final');
  return playGame(sportKey, scoreA, scoreB, UPSET_SIGMA[upsets] || 0, r, true);
}

// Full pro season: real season lengths and playoff formats, scaled to the size of your league.
// field = [playoff teams, league teams] in the real league, so the share of teams that qualify matches.
// series = best-of lengths from the first round to the final (shorter brackets use the last entries).
const SEASONS = {
  basketball: { league: 'NBA', games: 82, field: [16, 30], pow2: true, series: [7], sigma: 5, desc: '82 games, then best-of-7 playoff series in every round' },
  football: { league: 'NFL', games: 17, field: [14, 32], series: [1], sigma: 6, desc: '17 games, then single-elimination playoffs where the top seeds get byes' },
  baseball: { league: 'MLB', games: 162, field: [12, 30], series: [3, 5, 7, 7], sigma: 10, desc: '162 games, then best-of-3, 5, 7 and 7 series, with byes for the top seeds' },
  hockey: { league: 'NHL', games: 82, field: [16, 32], pow2: true, series: [7], sigma: 8, otl: true, desc: '82 games with overtime losses counted, then best-of-7 series' },
  volleyball: { league: 'Serie A1', games: 26, field: [8, 14], pow2: true, series: [3, 5, 5], sigma: 5, desc: '26 matches, then Serie A1-style playoffs: best-of-3 quarterfinals, best-of-5 semifinals and final' },
  brawl: { league: 'Royale Circuit', games: 30, field: [8, 16], pow2: true, series: [3, 3, 5], sigma: 7, desc: '30 fights, two against every other crew, then best-of-3 quarterfinals and semifinals and a best-of-5 final' },
  soccer: { league: 'Serie A', games: 38, field: null, sigma: 7, draws: 0.32, desc: '38 matches with draws. No playoffs: the table decides the title' },
};
const SEASON_VAR = 1; // global scale for game-to-game swings in a full season

// Balanced schedule: cycle round-robin rounds (circle method) until everyone has played `games`.
function seasonSchedule(n, games) {
  const ids = Array.from({ length: n % 2 ? n + 1 : n }, (_, i) => i), m = ids.length, rounds = [];
  for (let r = 0; r < m - 1; r++) {
    const rd = [];
    for (let k = 0; k < m / 2; k++) { const a = ids[k], b = ids[m - 1 - k]; if (a < n && b < n) rd.push(r % 2 ? [b, a] : [a, b]); }
    rounds.push(rd);
    ids.splice(1, 0, ids.pop());

  const cnt = new Array(n).fill(0), out = [];
  for (let r = 0, idle = 0; idle < rounds.length; r++) {
    let added = false;
    for (const [a, b] of rounds[r % rounds.length]) if (cnt[a] < games && cnt[b] < games) { out.push([a, b]); cnt[a]++; cnt[b]++; added = true; }

}
function bracketOrder(P) { let o = [1]; while (o.length < P) { const k = o.length * 2; o = o.flatMap(s => [s, k + 1 - s]); } return o; }
function playoffField(sportKey, n) {
  const S = SEASONS[sportKey]; if (!S.field) return 0;

  const need = Math.ceil(bo / 2); let wa = 0, wb = 0, last = null; const games = [], ev = [];
  while (wa < need && wb < need) {

}
function simSeason(sportKey, teams, rng) {
  const S = SEASONS[sportKey], n = teams.length, sigma = S.sigma * SEASON_VAR;
  const rec = teams.map(() => ({ w: 0, l: 0, d: 0, otl: 0, pf: 0, pa: 0 }));
  const games = [];
  for (const [a, b] of seasonSchedule(n, S.games)) {
    const g = gameRatings(teams[a].score, teams[b].score, false, rng);
    const m = g.ra - g.rb + gauss(rng) * sigma;
    if (S.draws && Math.abs(m) < S.draws * sigma) {
      const k = Math.floor(rng() * 3) - (rng() < 0.4 ? 1 : 0), gl = Math.max(0, k);

    const W = m > 0 ? a : b, L = W === a ? b : a, line = scoreline(sportKey, Math.abs(m), (g.ra + g.rb) / 2, rng);
    rec[W].w++;
    if (S.otl && /OT|SO/.test(line[2])) rec[L].otl++; else rec[L].l++;
    rec[W].pf += line[0]; rec[W].pa += line[1]; rec[L].pf += line[1]; rec[L].pa += line[0];
    games.push({ a, b, w: W, line, m: Math.abs(m) });

  const pts = r => S.draws ? 3 * r.w + r.d : S.otl ? 2 * r.w + r.otl : 0;
  const pct = r => (r.w + 0.5 * r.d) / Math.max(1, r.w + r.l + r.d + r.otl);
  const standings = teams.map((t, i) => ({ i, ...rec[i], pts: pts(rec[i]), pct: pct(rec[i]) }))
    .sort((x, y) => (S.draws || S.otl ? y.pts - x.pts : y.pct - x.pct) || (y.pf - y.pa) - (x.pf - x.pa) || teams[y.i].score.rating - teams[x.i].score.rating);

  const seeds = standings.slice(0, F).map(s => s.i);
  let P = 1; while (P < F) P *= 2;
  let slots = bracketOrder(P).map(sn => sn <= F ? seeds[sn - 1] : null);

  for (let r = 0; r < R; r++) {
    const bo = S.series[Math.max(0, S.series.length - R + r)] || 1, res = [], next = [];
    for (let k = 0; k < slots.length; k += 2) {
      const a = slots[k], b = slots[k + 1];

      const s = playSeries(sportKey, teams, a, b, bo, S.sigma * SEASON_VAR, rng);

}

// Post-season write-ups. Words only: the only numbers are records, seeds and scores — never fits, grades or ranks.
const TRAIT_STR = { spd: ['speed', 'straight-line speed'], agi: ['quickness', 'footwork'], str: ['strength', 'power'], siz: ['size', 'length'], lep: ['leaping ability', 'bounce'], end: ['stamina', 'motor'], tch: ['touch', 'soft hands'], acc: ['accuracy', 'precision'], ref: ['reflexes', 'anticipation'], iq: ['feel for the game', 'vision'], clu: ['composure', 'nerve in big moments'], ldr: ['leadership', 'command'] };
const TRAIT_LACK = { spd: 'the speed', agi: 'the footwork', str: 'the strength', siz: 'the size', lep: 'the bounce', end: 'the stamina', tch: 'the hands', acc: 'the accuracy', ref: 'the reflexes', iq: 'the game IQ', clu: 'the composure', ldr: 'the command' };

function rcPick(r, arr) { return arr[Math.floor(r() * arr.length) % arr.length]; }
function rcAnd(list) { return list.length < 2 ? (list[0] || '') : list.slice(0, -1).join(', ') + ' and ' + list[list.length - 1]; }
function rcPoss(h) { return h + (/s$/.test(h.replace(/<[^>]+>/g, '')) ? '’' : '’s'); }
function rcPosName(p) { return p.nm.replace(/\s*\(.*\)$/, ''); }
function rcAt(p) {

  const n = rcPosName(p);

function rcSpot(p) { return p.coach ? 'coaching' : p.bench ? 'bench' : rcPosName(p).toLowerCase(); }

// First mention: full name. Later NBA mentions use the surname, the way a broadcaster would.

// Average fit and attribute profile per position across a set of rosters.
function rcBaseline(sportKey, rowSets) {

    const rs = rowSets.map(rows => rows[i]).filter(x => x && x.cand), n = Math.max(1, rs.length);
    return { fit: rs.reduce((s, x) => s + x.fit, 0) / n, a: AK.map((_, k) => rs.reduce((s, x) => s + x.cand.a[k], 0) / n) };

// The level of a solid starter from this pool at each position (for two-team contests).

    const top = cands.map(c => ({ c, f: fitAI(sportKey, c, p) })).sort((x, y) => y.f - x.f).slice(0, k), n = Math.max(1, top.length);

function rcEdges(c, ref, p, n, r) {

  if (!ks.length) ks = [...p.keys].sort((a, b) => c.a[b] - c.a[a]).slice(0, n).map(k => AK[k]);

function rcLackKey(c, ref, p) { if (p.styles) p = bestStyle(c.a, p).st; return AK[p.keys.map(k => ({ k, v: (c.a[k] - ref[k]) * (p.w[AK[k]] || 0) })).sort((a, b) => a.v - b.v)[0].k]; }

// Shared building blocks
function rcStars(sportKey, sc, base, N, r) {
  const eff = sc.rows.map((x, i) => x.cand ? { x, i, d: (x.fit - base[i].fit) * x.w } : null).filter(Boolean).sort((a, b) => b.d - a.d);
  const A = eff[0], B = eff[1];
  if (!A) return { text: '', eff };
  const tA = rcEdges(A.x.cand, base[A.i].a, A.x.pos, 2, r);
  if (A.d <= 0) return { text: `${N(A.x.cand)} was the one bright spot ${rcAt(A.x.pos)}, getting by on ${tA}.`, eff, used: [A.i] };
  let s = A.x.pos.coach
    ? `${N(A.x.cand)} ${rcPick(r, ['pushed the right buttons', 'had them prepared', 'ran a tight ship'])} from the sideline, ${rcPick(r, ['winning with', 'leaning on'])} ${tA}`
    : `${N(A.x.cand)} ${rcPick(r, ['led the way', 'set the tone', 'was the engine', 'carried the load'])} ${rcAt(A.x.pos)}, ${rcPick(r, ['winning with', 'leaning on', 'living on'])} ${tA}`;
  if (B && B.d > 0) s += `, and ${N(B.x.cand)} ${rcPick(r, ['added', 'chipped in', 'brought'])} ${rcEdges(B.x.cand, base[B.i].a, B.x.pos, 1, r)} ${rcAt(B.x.pos)}`;

}
// Matchups the opponent won, biggest first
function rcMatchups(sportKey, mine, theirs) {

  if (m2 && m2.g >= 0.12) s += `, while ${rcPoss(N(m2.opp))} ${rcEdges(m2.opp, m2.me.a, m2.p, 1, r)} ${rcPick(r, ['won', 'swung', 'tilted'])} the ${rcSpot(m2.p)} battle`;

// Playoff Boom and clutch moments. evs: [{ team, i, kind, g, ri, bo }] for the games that matter.
function rcSpark(evs, teams, me, opp, N, r, o) {

  const cand = e => teams[e.team].score.rows[e.i].cand;
  const w = e => { const t = when(e); return t ? ' ' + t : ''; };
  if (o.lost) {
    const ob = evs.find(e => e.team === opp && e.kind === 'boom'), mb = evs.find(e => e.team === me && e.kind === 'bust');
    if (ob && mb) return `${N(cand(mb))} went cold${w(mb)}, while ${N(cand(ob))} caught fire for ${o.O}${w(ob)}.`;
    if (ob) return `${N(cand(ob))} ${rcPick(r, ['caught fire', 'went off', 'had the game of a lifetime'])} for ${o.O}${w(ob)}.`;
    if (mb) return `${N(cand(mb))} went cold${w(mb)}, the worst possible time.`;
    const oc = evs.find(e => e.team === opp && e.kind === 'clutch');
    if (oc) { const c = cand(oc); return `${rcPoss(N(c))} ${esc(c.sig.name)} showed up for ${o.O} when it counted.`; }
    return '';
  }
  const booms = evs.filter(e => e.team === me && e.kind === 'boom');
  const mb = booms[booms.length - 1];
  if (mb) return `${N(cand(mb))} ${rcPick(r, ['caught fire', 'went off', 'took over'])}${w(mb)}${booms.length > 1 && cand(booms[0]) !== cand(mb) ? `, and ${N(cand(booms[0]))} had a big night too` : ''}.`;
  const mc = evs.find(e => e.team === me && e.kind === 'clutch');
  if (mc) { const c = cand(mc); return `${rcPoss(N(c))} ${esc(c.sig.name)} showed up every time it mattered.`; }

// Championship / Dealt Hand
function champRecap(sportKey, teams, sim, sigma) {
  const r = rngFrom('recap|' + teams.map(t => t.name + t.score.rows.map(x => x.cand ? x.cand.id : '').join()).join('|') + sim.champ);
  const N = rcNamer(), me = teams[0].score, rn = roundNames(sim.rounds.length), season = sim.format === 'season';
  const base = rcBaseline(sportKey, teams.map(t => t.score.rows));
  const st = sim.standings.find(s => s.i === 0), place = sim.standings.findIndex(s => s.i === 0) + 1;
  const rec = recordText(sportKey, st, sim.format), T = rcTeam(teams[0].name);
  const tn = i => 'the ' + esc(teams[i].name), Tn = i => 'The ' + esc(teams[i].name);
  const score = g => lineText(sportKey, g.line);
  const myGames = sim.rounds.flatMap((rd, ri) => rd.filter(g => g.a === 0 || g.b === 0).map(g => ({ ...g, ri })));
  const lostGame = myGames.find(g => g.w !== 0);

  let opp = null, matchLead = null, evs = [];
  // the opponent who had the user's number over the regular season
  const nemesis = () => {
    const h = {};
    for (const g of sim.games) { if (g.a !== 0 && g.b !== 0) continue; const o = g.a === 0 ? g.b : g.a; h[o] = h[o] || { w: 0, n: 0 }; h[o].n++; if (g.w === o) h[o].w++; }
    const best = Object.entries(h).sort((x, y) => (y[1].w * 2 - y[1].n) - (x[1].w * 2 - x[1].n) || y[1].w - x[1].w)[0];
    return best && best[1].w ? { o: +best[0], ...best[1] } : null;
  };

    const lead = sim.standings[0], gap = lead.pts - st.pts;
    if (sim.champ === 0) { const ru = sim.standings[1]; out.push(`${T} won the league at ${rec}, ${st.pts} points, finishing ${st.pts - ru.pts === 0 ? 'level with' : (st.pts - ru.pts) + ' ' + (st.pts - ru.pts === 1 ? 'point' : 'points') + ' clear of'} ${tn(ru.i)}.`); }
    else {

    }

    out.push(`${T} went ${rec} and ${rcPick(r, ['finished the job', 'closed it out', 'took the title'])}, beating ${tn(o)} ${score(fg)} in the final${fg.bo > 1 ? ' series' : ''}.`);

  } else if (lostGame) {
    opp = lostGame.w;
    const seed = sim.seeds.indexOf(0) + 1;
    out.push(lostGame.ri === sim.rounds.length - 1
      ? `${T} went ${rec} and reached the final, where ${tn(opp)} won it ${score(lostGame)}.`
      : `${T} went ${rec} and got in as the ${ordinal(seed)} seed, but ${tn(opp)} ended the run in the ${rn[lostGame.ri].toLowerCase()}, ${score(lostGame)}.`);
    matchLead = nm => `${nm} did the most damage for ${tn(opp)}`;
    evs = (lostGame.ev || []).map(e => ({ ...e, ri: lostGame.ri, bo: lostGame.bo }));
  } else {
    out.push(`${T} went ${rec}, ${ordinal(place)} of ${teams.length}, and missed the playoffs.`);
    if (season) { const ne = nemesis(); if (ne) { opp = ne.o; matchLead = nm => `${Tn(opp)} had their number, winning ${ne.w} of ${ne.n} meetings, and ${nm} did the damage`; } }
    else {
      const losses = sim.games.filter(g => (g.a === 0 || g.b === 0) && g.w !== 0).sort((a, b) => (b.m ?? (b.line[0] - b.line[1])) - (a.m ?? (a.line[0] - a.line[1])));

    const muOk = mu && mu.g > 0.05;

    if (cm < 3) { out.push(`The ${rcPick(r, ['scare', 'closest call'])} came in the ${rn[close.ri].toLowerCase()} against ${tn(o)} (${score(close)})${muOk ? `, where ${N(mu.opp)} won the ${rcSpot(mu.p)} matchup over ${N(mu.me)} with ${rcEdges(mu.opp, mu.me.a, mu.p, 2, r)}` : ''}.`); if (muOk) used = [mu.i]; }
    else { out.push(`${swept ? 'They swept every playoff series' : 'Nobody in the playoffs really tested them'}${muOk ? `; ${N(mu.opp)} of ${tn(o)} gave them the most trouble ${rcAt(mu.p)}` : ''}.`); if (muOk) used = [mu.i]; }
  }
  out.push(rcSpark(evs, teams, 0, opp, N, r, { lost: sim.champ !== 0, O: opp != null ? tn(opp) : '', rn }));

}

// Head-to-Head, told from one side
function h2hRecap(sportKey, mine, theirs, myName, oppName, iWon, line, sigma, poolCands, seed, ev = []) {
  const r = rngFrom('recap|' + seed + '|' + myName);
  const N = rcNamer(), T = `<b>${esc(myName)}</b>`, O = `<b>${esc(oppName)}</b>`;
  const base = rcPoolBaseline(sportKey, poolCands);
  const sc = lineText(sportKey, line);
  const out = [iWon ? `${T} ${rcPick(r, ['beat', 'got past', 'took down'])} ${O} ${sc}.` : `${O} ${rcPick(r, ['beat', 'got the better of'])} ${T} ${sc}.`];
  const stars = rcStars(sportKey, mine, base, N, r);
  out.push(stars.text);
  let used = [];
  const mu = rcMatchups(sportKey, mine, theirs);
  if (iWon) {
    if (mu[0] && mu[0].g >= 0.12) { out.push(`${rcPoss(O)} best answer was ${N(mu[0].opp)}, who won the ${rcSpot(mu[0].p)} matchup over ${N(mu[0].me)} with ${rcEdges(mu[0].opp, mu[0].me.a, mu[0].p, 2, r)}.`); used = [mu[0].i]; }
    else out.push(`${O} didn’t win many individual matchups.`);
  } else {
    const dmg = rcDamage(mu, N, r, nm => `${nm} did the most damage for ${O}`);
    if (dmg) { out.push(dmg.text); used = dmg.used; }
    else out.push(`${O} didn’t win many individual matchups.`);
  }

// ----- Projected season averages -----
// Everyone without real NBA numbers gets a line built from the NBA players whose attribute profiles
// look most like theirs at that spot, scaled by how well they fit the role.
const COMP_CACHE = {};

function renderModal() {
  if (S.modal !== 'howto') return '';
  return `<div class="modal-back" data-act="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-label="How scoring works" data-stop="1">
    <div class="row" style="justify-content:space-between"><h2 class="h">How scoring works</h2><button class="btn small" data-act="close-modal">Close</button></div>
    <p>Every candidate in every pool carries the same 12-attribute profile, rated 1–99 on one universal scale: <b>99</b> is a superhuman ceiling, <b>90</b> the best human ever in that trait, <b>75</b> a good pro, <b>50</b> an average adult, <b>25</b> a small child. That's why a Hulk, a Hall of Famer and a Muppet can be compared directly.</p>
    <div class="attr-grid">${ATTRS.map(a => `<div><b>${a.n}</b><span class="muted">${a.d}</span></div>`).join('')}</div>
    <p>Each position leans on a few of those traits (the chips under a position name show which). A pick's fit is mostly how well their profile matches the role, with extra weight on their weakest key trait, so a one-trick pick gets exposed. <b>No scores, grades or rankings are ever shown.</b> You find out how you did from the results.</p>
    <p><b>Chemistry:</b> people with a real connection play better together: same championship team, same college, same faction or franchise, or the same archetype. Two linked picks help a little, three help more, and it never outweighs talent. Coaches add a second layer: a coach's system favors certain traits, so a Seven-Seconds-or-Less coach lifts a fast roster. Links that fire are revealed after the game.</p>
    <p><b>Battle Royale:</b> a straight-up 5-on-5 fight. Two Tanks hold the front (size, stamina, strength). Three Damage dealers do the hurting, and they can be anything: each is judged by whichever style suits them best, Power (strength and stamina), Speed (speed, agility, reflexes) or Precision (accuracy, reflexes, smarts). The Commander calls it and the Reinforcement lifts the whole crew. Results are knockouts: the winners drop all five, and the loser's count shows how close it got. <b>Variety pays:</b> every fighter brings one or more styles (Ranged, Flyer, Technician, Close quarters, Explosives, Powers &amp; magic), and a crew covering three, four or five different styles gets a growing bonus, about as big as strong chemistry. It's revealed after the fight.</p>
    <p><b>Baseball:</b> every spot but the pitcher also bats, and hitting is scored apart from fielding. A position's traits are its glove; the batting order is a second layer built from all nine hitters (contact from Reflexes and Accuracy, power from Strength), with the best bats hitting first and coming up most. Hulk can be a liability at shortstop and still hit bombs. Offense counts about as much as pitching and defense.</p>
    <p>Team strength is the importance-weighted average of every player's fit (a QB or a setter counts more than a guard or a slot receiver), scaled by the coach's Game IQ, Leadership and Clutch, plus chemistry.</p>
    <p><b>Basketball knows the NBA:</b> NBA players playing basketball blend their real prime production (their three best seasons on Basketball-Reference) into how well they fit, and NBA coaches get a bump coaching basketball. In a Championship season everyone gets a stat line: NBA players start from their real prime numbers, and everyone else is projected from the NBA players who play most like them.</p>
    <p><b>Bench Spark:</b> every team carries one bench player who lives on intangibles: Stamina, Leadership and Clutch. A great one lifts the whole squad, a little less than a great coach does.</p>
    <p><b>Signature moves:</b> the most iconic characters carry a named signature move. What it does stays hidden until after the game. Some lift the whole squad, some let a lopsided build play bigger than it is, some rise up in the playoffs, and some knock opponents off balance. The computer drafts don't know about them.</p>
    <p><b>Playoff Boom:</b> some players are boom-or-bust. In any playoff game they can catch fire and take over, or go cold. They're a gamble, and that's the point.</p>
    <p><b>Full pro season:</b> instead of a quick round robin, play a real-length season (82 NBA games, 17 NFL games, 162 MLB games, 82 NHL games with overtime losses, 26 Serie A1 volleyball matches, or 38 soccer matches with draws), then that league's playoff format: series, byes and all. Soccer has no playoffs; the table decides the title.</p>
    <p><b>Championship:</b> fan-cast your lineup with no limits, share it, then play a full pro-length season against teams from every universe. Each opponent comes from a single universe (only Mashup casts face mixed All-Star teams), every universe sends a contender (scaled to the best your own universe could field, so any universe can go perfect), and the rest is a random mix. The goal: the perfect season, undefeated through the regular season and the playoffs. <b>Dealt Hand:</b> its own mode. Each pick deals you ${HAND_SIZE} random candidates you haven't seen yet; you take one and place them in any open spot, with ${REDEALS} redeals per draft. Anyone you pass on is gone from your hands for good, though a rival may still draft them. Rival teams draft alongside you in a snake order. By default they draft like good fans from random hands: usually smart, sometimes wrong. Random rivals are easy; Sharp rivals always take the best fit. <b>Head-to-Head:</b> two people draft from the same pool and the higher rating wins. With upsets off, the better team wins unless a boom player catches fire.</p>

function nextEmpty(sportKey, roster, after) {
  const pos = SPORTS[sportKey].pos; let i = after ? pos.findIndex(p => p.id === after) : -1;
  for (let k = 1; k <= pos.length; k++) { const p = pos[(i + k) % pos.length]; if (!roster[p.id]) return p.id; }
  return null;
}
// ----- Dealt Hand -----
function handMode() { return S.mode === 'deal'; }
function rosterFull(sportKey, roster) { return SPORTS[sportKey].pos.every(p => roster[p.id]); }
function takenIds() {
  const c = S.champ, t = new Set(Object.values(c.roster).map(x => x.id));
  for (const r of c.ai || []) for (const x of Object.values(r)) t.add(x.id);
  return t;
}
function availCands() { const t = takenIds(); return getCands(S.champ.poolId).filter(x => !t.has(x.id)); }
// Nobody is dealt to you twice: everyone you've been shown goes into `seen`.
function freshCands() { const seen = new Set(S.champ.seen || []); return availCands().filter(x => !seen.has(x.id)); }
function userRoundsLeft() { const c = S.champ; return SPORTS[c.sport].pos.filter(p => !c.roster[p.id]).length; }
function shuffled(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function dealHand() {
  const c = S.champ;
  let hand = shuffled(freshCands()).slice(0, HAND_SIZE);
  if (!hand.length) hand = shuffled(availCands()).slice(0, HAND_SIZE); // safety net; the reserve below keeps this from happening
  c.seen = [...new Set([...(c.seen || []), ...hand.map(x => x.id)])];
  c.hand = hand;
  c.handSel = null; c.sel = null;
}
// A redeal is allowed only if enough unseen candidates remain for every later hand.
function canRedeal() { const c = S.champ; return c.redeals > 0 && freshCands().length >= HAND_SIZE * userRoundsLeft(); }
function resetDraft() { const c = S.champ; c.roster = {}; c.hand = []; c.seen = []; c.handSel = null; c.sel = null; c.redeals = REDEALS; c.result = null; c.queue = null; c.ai = null; c.pickIdx = 0; c.draftOpps = null; }
// Live snake draft: you and the rival teams take turns, each pick from a dealt hand. Queue entry 0 = you, k = rival k.
function initHandDraft() {
  const c = S.champ, T = c.opps + 1, P = SPORTS[c.sport].pos.length;
  resetDraft();
  const order = [...Array(T).keys()].sort(() => Math.random() - 0.5);
  c.queue = []; for (let r = 0; r < P; r++) c.queue.push(...(r % 2 === 0 ? order : [...order].reverse()));
  c.ai = Array.from({ length: c.opps }, () => ({}));
  c.draftOpps = c.opps;
  advanceDraft();
}
function advanceDraft() {
  const c = S.champ, hb = handBase(c.sport, c.poolId, getCands(c.poolId));
  while (c.pickIdx < c.queue.length && c.queue[c.pickIdx] !== 0) {
    const team = c.queue[c.pickIdx] - 1;
    // Rivals deal from everyone still available. If that would leave too few unseen candidates for your
    // remaining hands, they deal from the players you passed on instead.
    const avail = availCands(), seen = new Set(c.seen || []);
    const fresh = avail.filter(x => !seen.has(x.id)), passed = avail.filter(x => seen.has(x.id));
    const tight = fresh.length - 1 < HAND_SIZE * userRoundsLeft() && passed.length;
    const from = tight ? passed : avail;
    const pick = c.rivals in RIVAL_NOISE
      ? aiHandPick(c.sport, c.ai[team], from, tight ? RESERVE_HAND : HAND_SIZE, Math.random, hb, RIVAL_NOISE[c.rivals])
      : randomPick(c.sport, c.ai[team], from);
    if (pick) c.ai[team][pick.slot] = pick.c;
    c.pickIdx++;
  }
  if (c.pickIdx < c.queue.length) dealHand(); else { c.hand = []; c.handSel = null; c.sel = null; }
}
function placeFromHand(slot, cid) {
  const c = S.champ, cand = c.hand.find(x => x.id === cid);
  if (!cand || c.roster[slot]) return;
  c.roster[slot] = cand;
  c.pickIdx++;
  advanceDraft();
}
// Random-roster rival: a random available candidate in a random open spot.
function randomPick(sportKey, roster, from) {
  const open = SPORTS[sportKey].pos.filter(p => !roster[p.id]);
  if (!open.length || !from.length) return null;
  return { c: from[Math.floor(Math.random() * from.length)], slot: open[Math.floor(Math.random() * open.length)].id };
}
function handDraftReady() { const c = S.champ; return !!(c.queue && c.ai && c.draftOpps === c.opps); }

}

// ----- Championship: simulate + results -----
function runChampionship() {
  if (!handMode()) return runPerfectSeason();
  const c = S.champ, sp = SPORTS[c.sport];
  const seed = Date.now() + ':' + Math.random();
  const rng = rngFrom(seed);
  const mine = new Set(Object.values(c.roster).map(x => x.id));
  const remaining = getCands(c.poolId).filter(x => !mine.has(x.id));
  const ai = handMode() && handDraftReady() ? c.ai.map(r => ({ ...r }))
    : handMode() && c.rivals in RIVAL_NOISE ? aiHandDraft(c.sport, remaining, c.opps, rng, HAND_SIZE, RIVAL_NOISE[c.rivals])
    : handMode() ? randomRosters(c.sport, remaining, c.opps, rng)
    : c.champRivals === 'even' ? aiDraft(c.sport, remaining, c.opps, rng) : aiStackDraft(c.sport, remaining, c.opps);
  const names = aiTeamNames(c.opps, rng);
  const teams = [{ name: c.teamName || 'Your team', roster: c.roster, user: true }, ...ai.map((r, i) => ({ name: names[i], roster: r }))];
  for (const t of teams) t.score = teamScore(c.sport, t.roster);
  const season = c.format === 'season';
  const sim = season ? simSeason(c.sport, teams, rng) : simChampionship(c.sport, teams, UPSET_SIGMA[c.upsets], rng);
  c.result = { teams, sim, season, recap: champRecap(c.sport, teams, sim, season ? 1 : UPSET_SIGMA[c.upsets]) };
  c.stage = 'results';
}
function userFinish(sim) {
  if (sim.champ === 0) return { title: 'Champions', line: sim.rounds.length ? 'Your team won it all.' : 'Your team won the league.' };
  const rounds = sim.rounds, names = roundNames(rounds.length);
  for (let r = 0; r < rounds.length; r++) for (const g of rounds[r]) if ((g.a === 0 || g.b === 0) && g.w !== 0) return { title: r === rounds.length - 1 ? 'Runner-up' : 'Out in the ' + names[r].toLowerCase(), line: '', lostTo: g.w, game: g };
  if (!rounds.length) return { title: ordinal(sim.standings.findIndex(s => s.i === 0) + 1) + ' place', line: '' };
  return { title: 'Missed the playoffs', line: '' };
}

// ===== Championship: fan-cast a lineup, share it, chase the perfect season =====
// The season is fixed: a real-length pro season against teams from every universe.
// Each opponent comes from ONE universe (NBA, Marvel, Cartoons, Muppets); mixed All-Star
// teams only show up when you cast from the All-Star Mashup yourself.
const LEAGUE_SIZE = { basketball: 30, football: 16, soccer: 20, baseball: 30, hockey: 32, volleyball: 14, brawl: 16 };

function universeLabel(id) { return UNIVERSE_LABEL[id] || (S.custom[id] ? (S.custom[id].short || S.custom[id].name) : 'Custom'); }

function shuffleWith(arr, rng) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// Opponent strength is set relative to the best team YOUR universe could field (its ceiling),
// in units of the sport's game-to-game swing, so a Muppets cast and an NBA cast face an equally
// hard road. Contenders sit just below that ceiling; everyone else is a step or more down.
// [contender gap, others min gap, others max gap] in swing units, tuned per season length.
const PERFECT_TIERS = { basketball: [1.4, 2.0, 3.8], football: [1.1, 1.5, 3.2], soccer: [1.3, 1.8, 3.6], baseball: [1.6, 2.0, 4.0], hockey: [1.6, 2.0, 4.0], volleyball: [1.2, 1.7, 3.4], brawl: [1.05, 1.5, 3.4] };

function poolCeiling(sportKey, poolId) {
  const k = sportKey + '|' + poolId + '|' + getCands(poolId).length;
  if (CEILING[k] == null) { const r = aiStackDraft(sportKey, getCands(poolId), 1)[0]; CEILING[k] = r ? teamScore(sportKey, r).rating : 70; }
  return CEILING[k];
}
// How useful a candidate is in this sport at their best spot (used to build weaker or stronger teams).
const CVAL = {};
function candVal(sportKey, c) { const k = sportKey + '|' + c.id; if (CVAL[k] == null) { let v = 0; for (const p of SPORTS[sportKey].pos) if (!p.coach && !p.bench) v = Math.max(v, fitAI(sportKey, c, p)); CVAL[k] = v; } return CVAL[k]; }

  const P = SPORTS[sportKey].pos.length, sig = SEASONS[sportKey].sigma, [ke, klo, khi] = PERFECT_TIERS[sportKey];
  const C = poolCeiling(sportKey, userPoolId);

  const avail = u => getCands(u).filter(c => !used.has(c.id));
  // A team from one universe aimed at a strength target: the best lineup that universe can make from
  // only its weakest slice of available talent. A bigger slice makes a stronger team, so the slice is
  // searched until the team lands near the target. Any universe can field a contender or a long shot.
  const take = (u, target) => {

      let slice = a.slice(0, m);

      if (slice.length < P) slice = a.slice(0, m);
      const r = aiStackDraft(sportKey, slice, 1, false)[0]; if (!r) break;

      if (!best || d < best.d) best = { d, r };
      if (best.d < 0.4) break;
      if (rating > target) hi = t; else lo = t;
      t = (lo + hi) / 2;

    if (!best) return null;
    // keep a team only if it's no stronger than a contender and not a total mismatch; otherwise that
    // universe has nothing left at this level and sits out the rest of the season
    const rating = teamScore(sportKey, best.r).rating;
    if (rating > C - ke * sig + 0.5 * sig || rating < target - 2 * sig) { closed.add(u); return null; }

// ===== Web version storage: a small Supabase-backed stand-in for Claude's shared db =====
// Same calls the game already uses: collection().orderBy().limit().onSnapshot/get/add, where(), doc().get/update/onSnapshot/acquire.
function supaDB(url, key) {
  const sb = window.supabase.createClient(url, key, { auth: { persistSession: false } });
  const snapOf = row => ({ id: row.path.split('/')[1], exists: true, data: () => row.data });
  const fail = () => ({ code: 'unavailable' });
  const randId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  let chanN = 0;
  return {
    collection(name) {
      const q = { limit: 100, where: null };
      const api = {
        orderBy() { return api; },
        limit(n) { q.limit = n; return api; },
        where(f, op, v) { q.where = [f, v]; return api; },
        async get() {
          let r = sb.from('docs').select('path,data').eq('coll', name);
          if (q.where) r = r.eq('data->>' + q.where[0], String(q.where[1]));
          const { data, error } = await r.order('updated_at', { ascending: false }).limit(q.limit);
          if (error) throw fail();
          return { docs: data.map(snapOf) };
        },
        onSnapshot(cb, err) {
          let alive = true, t = null;
          const run = () => api.get().then(s => alive && cb(s)).catch(e => err && err(e));
          const soon = () => { clearTimeout(t); t = setTimeout(run, 150); };
          run();
          const ch = sb.channel('c' + (chanN++)).on('postgres_changes', { event: '*', schema: 'public', table: 'docs', filter: 'coll=eq.' + name }, soon).subscribe();
          const iv = setInterval(run, 20000);
          return () => { alive = false; clearInterval(iv); sb.removeChannel(ch); };
        },
        async add(doc) {
          const id = randId();
          const { error } = await sb.from('docs').insert({ path: name + '/' + id, coll: name, data: { ...doc, id } });
          if (error) throw fail();
          return { id };
        },
      };
      return api;
    },
    doc(path) {
      const id = path.split('/')[1];
      const api = {
        async get() {
          const { data, error } = await sb.from('docs').select('path,data').eq('path', path).maybeSingle();
          if (error) throw fail();
          return data ? snapOf(data) : { id, exists: false, data: () => null };
        },
        onSnapshot(cb, err) {
          let alive = true;
          const run = () => api.get().then(s => alive && cb(s)).catch(e => err && err(e));
          run();
          const ch = sb.channel('d' + (chanN++)).on('postgres_changes', { event: '*', schema: 'public', table: 'docs', filter: 'path=eq.' + path },
            p => { if (alive && p.new && p.new.data) cb(snapOf(p.new)); else run(); }).subscribe();
          const iv = setInterval(run, 4000); // safety net if the live connection drops
          return () => { alive = false; clearInterval(iv); sb.removeChannel(ch); };
        },
        async update(patch) {
          const { data, error } = await sb.rpc('doc_update', { p_path: path, p_patch: patch });
          if (error || !data) throw fail();
        },
        async acquire({ holder, ttlMs }) {
          const { data, error } = await sb.rpc('doc_acquire', { p_path: path, p_holder: holder, p_ttl_ms: ttlMs });
          return { acquired: !error && !!data };
        },
      };
      return api;
    },
  };
}

    g.status = 'saving'; render();
    const title = topic.replace(/\b\w/g, m => m.toUpperCase());
    const pool = { name: title, short: title.slice(0, 24), blurb: `${entries.length} rated by Claude on the universal scale`, topic, createdAt: Date.now(), entries };
    let id = null;
    if (S.cap.db) { try { const ref = await S.cap.db.collection('pools').add({ ...pool, createdBy: S.cap.uid || null }); id = ref.id; } catch { } }
    if (!id) { id = 'local-' + Date.now().toString(36); const local = lsGet('da.custom', {}); local[id] = { ...pool, id }; lsSet('da.custom', local); }
    S.custom[id] = { ...pool, id };
    delete candCache[id];
    if (S.mode !== 'h2h') { S.champ.poolId = id; saveChamp(); } else { S.h2h.form.poolId = id; lsSet('da.h2hform', S.h2h.form); }
    g.status = 'done'; render();
    toast(`${title}: ${entries.length} candidates ready`);
  } catch (e) {
    g.status = 'idle'; g.err = e && e.code === 'cancelled' ? '' : genErr(e); render();
  }
}

// ===== Render + events =====
let lastFocus = null;
function render() {
  const app = $('#app');
  const ae = document.activeElement; lastFocus = ae && ae.id ? { id: ae.id, s: ae.selectionStart, e: ae.selectionEnd } : null;
  let main;
  if (S.mode !== 'h2h') main = S.champ.stage === 'setup' ? renderChampSetup() : S.champ.stage === 'draft' ? renderChampDraft() : S.champ.result && S.champ.result.cross ? renderPerfectResults() : renderChampResults();
  else main = renderH2H();
  const draftActive = S.mode !== 'h2h' ? S.champ.stage === 'draft' : S.h2h.stage === 'room' && S.h2h.contest?.status === 'drafting';
  document.documentElement.classList.toggle('draft-active', draftActive);
  app.innerHTML = renderTop() + `<main>${main}</main>` + renderModal() + renderShareModal();
  if (lastFocus) { const el = document.getElementById(lastFocus.id); if (el && el.tagName === 'INPUT') { el.focus(); try { el.setSelectionRange(lastFocus.s, lastFocus.e); } catch { } } }
}
function refreshPlist() {
  const el = $('#plist'); if (!el) return;
  if (S.mode !== 'h2h') { const c = S.champ; el.innerHTML = plistHTML({ sportKey: c.sport, poolId: c.poolId, sel: c.sel, taken: champTaken(), showRatings: c.showRatings, query: c.query, pickAct: 'c-pick' }); }
  else { const d = S.h2h.contest; if (!d) return; const me = mySide(d), sp = SPORTS[d.sport]; const taken = new Map(); for (const p of d.picks) taken.set(p.cid, p.s === me ? 'Your ' + sp.pos.find(x => x.id === p.slot).ab : contestName(d, p.s)); el.innerHTML = plistHTML({ sportKey: d.sport, poolId: d.poolId, sel: S.h2h.sel, taken, showRatings: d.rules.ratings === 'shown', query: S.h2h.query, pickAct: 'h-pick', readOnly: sideForPick(d.picks.length, d) !== me }); }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.dataset.act === 'close-modal' && e.target.closest('[data-stop]') && !e.target.closest('button[data-act="close-modal"]')) return;
  const a = t.dataset.act, c = S.champ, h = S.h2h;
  switch (a) {
    case 'mode': S.mode = t.dataset.mode; lsSet('da.mode', S.mode); S.gen.open = false; break;
    case 'howto': S.modal = 'howto'; break;
    case 'close-modal': S.modal = null; break;
    // championship
    case 'c-sport': if (c.sport !== t.dataset.sport) { c.sport = t.dataset.sport; resetDraft(); } break;
    case 'c-pool': if (c.poolId !== t.dataset.pool) { c.poolId = t.dataset.pool; resetDraft(); } S.gen.open = false; break;
    case 'c-rivals': if (c.rivals !== t.dataset.v) { c.rivals = t.dataset.v; if (c.queue) resetDraft(); } break;
    case 'hand-pick': {
      const cid = t.dataset.cid;
      if (c.sel && !c.roster[c.sel]) placeFromHand(c.sel, cid);
      else c.handSel = c.handSel === cid ? null : cid;
      break;
    }
    case 'hand-redeal': if (canRedeal()) { c.redeals--; dealHand(); toast(`New hand dealt. ${c.redeals} redeal${c.redeals === 1 ? '' : 's'} left.`); } break;
    case 'c-newdeal': initHandDraft(); c.stage = 'draft'; window.scrollTo(0, 0); break;
    case 'c-upsets': c.upsets = t.dataset.v; break;
    case 'c-crivals': c.champRivals = t.dataset.v === 'even' ? 'even' : 'stack'; break;
    case 'c-format': c.format = t.dataset.v === 'season' ? 'season' : 'quick'; break;
    case 'c-ratings': c.showRatings = t.dataset.v === '1'; break;
    case 'c-start':
      c.stage = 'draft';
      if (handMode()) { c.sel = null; if (!handDraftReady()) initHandDraft(); else if (!c.hand.length && c.pickIdx < c.queue.length) dealHand(); }
      else { c.sel = nextEmpty(c.sport, c.roster); if (window.innerWidth < 900) c.sel = null; }
      window.scrollTo(0, 0); break;
    case 'c-setup': c.stage = 'setup'; c.sel = null; c.result = null; break;
    case 'slot':
      if (handMode()) {
        const slot = t.dataset.slot;
        if (c.roster[slot]) break;
        if (c.handSel) placeFromHand(slot, c.handSel);
        else c.sel = c.sel === slot ? null : slot;
      }
      else if (S.mode === 'champ') { c.sel = t.dataset.slot; c.query = ''; }
      else { h.sel = t.dataset.slot; h.query = ''; }
      break;
    case 'c-close': c.sel = null; break;
    case 'c-pick': { const cand = candById(c.poolId, t.dataset.cid); if (!cand || !c.sel) break; c.roster[c.sel] = cand; c.query = ''; c.sel = window.innerWidth < 900 ? null : nextEmpty(c.sport, c.roster, c.sel); break; }
    case 'c-remove': delete c.roster[c.sel]; break;
    case 'c-random': { const have = new Set(Object.values(c.roster).map(x => x.id)); const pool = getCands(c.poolId).filter(x => !have.has(x.id)).sort(() => Math.random() - 0.5); for (const p of SPORTS[c.sport].pos) if (!c.roster[p.id]) c.roster[p.id] = pool.pop(); c.sel = null; break; }
    case 'c-sim': case 'c-rerun': runChampionship(); window.scrollTo(0, 0); break;
    case 'c-edit': c.stage = 'draft'; c.result = null; break;
    case 'c-copy': copyText(champResultText()); return;
    case 'c-share': shareLineup(); return;
    // generation
    case 'gen-open': S.gen.open = !S.gen.open; break;
    case 'gen-size': S.gen.size = +t.dataset.v; break;
    case 'gen-go': generatePool(); return;
    case 'gen-stop': if (S.gen.ctl) S.gen.ctl.abort(); return;
    // head-to-head
    case 'h-sport': h.form.sport = t.dataset.sport; lsSet('da.h2hform', h.form); break;
    case 'h-pool': h.form.poolId = t.dataset.pool; S.gen.open = false; lsSet('da.h2hform', h.form); break;
    case 'h-form': { const k = t.dataset.k, v = t.dataset.v; h.form[k] = k === 'timer' ? +v : v; lsSet('da.h2hform', h.form); break; }
    case 'h-create': createContest(); return;
    case 'h-join': joinContest(t.dataset.id); return;
    case 'h-join-code': joinByCode(); return;
    case 'h-open': h.err = ''; openRoom(t.dataset.id); return;
    case 'h-lobby': leaveRoom(); return;
    case 'h-cancel': cancelContest(); return;
    case 'h-close': h.sel = null; break;
    case 'h-pick': if (h.sel) makePick(h.sel, t.dataset.cid); return;
    case 'h-copy-invite': copyText(t.dataset.text); return;
    case 'h-rematch': rematch(); return;
  }
  saveChamp();
  render();
});
document.addEventListener('input', e => {
  const k = e.target.dataset.input; if (!k) return;
  const v = e.target.value;
  if (k === 'c-team') { S.champ.teamName = v; saveChamp(); }
  else if (k === 'c-opps') { S.champ.opps = +v; const l = $('#c-opps-v'); if (l) l.textContent = v; saveChamp(); }
  else if (k === 'pick-q') { if (S.mode !== 'h2h') S.champ.query = v; else S.h2h.query = v; refreshPlist(); }
  else if (k === 'h-team') { S.h2h.form.teamName = v; lsSet('da.h2hform', S.h2h.form); }
  else if (k === 'h-code') { S.h2h.joinCode = v.toUpperCase(); }
  else if (k === 'gen-topic') { S.gen.topic = v; const b = document.querySelector('[data-act="gen-go"]'); if (b) b.disabled = v.trim().length < 2; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.modal) { S.modal = null; render(); } else if (S.champ.sel || S.h2h.sel || S.champ.handSel) { S.champ.sel = null; S.h2h.sel = null; S.champ.handSel = null; render(); } }
  if (e.key === 'Enter' && e.target.id === 'h-code') joinByCode();
  if (e.key === 'Enter' && e.target.id === 'gen-topic' && S.gen.topic.trim().length >= 2) generatePool();
});

render();
(async function initCaps() {
  if (!window.claude || typeof window.claude.use !== 'function') {
    // web version: Head-to-Head runs on Supabase; custom "any topic" pools stay in the Claude version
    if (window.DA_SUPA && window.supabase) { try { S.cap.db = supaDB(window.DA_SUPA.url, window.DA_SUPA.key); S.cap.uid = webUid(); S.cap.web = true; } catch { } }
    S.cap.ready = true; subscribePools(); if (S.cap.db) subscribeContests(); handleJoinLink(); render(); return;
  }
  const [db, user, sample] = await Promise.all(['db', 'user', 'sample'].map(n => window.claude.use(n).catch(() => null)));
  S.cap.db = db; S.cap.user = user; S.cap.sample = sample;
  try { S.cap.uid = user ? await user.id() : null; } catch { S.cap.uid = null; }
  S.cap.ready = true;
  subscribePools();
  subscribeContests();
  handleJoinLink();
  render();
})();
// ?join=CODE invite links open Head-to-Head and join straight away
function handleJoinLink() {
  let code = '';
  try { code = (new URLSearchParams(location.search).get('join') || '').trim().toUpperCase(); } catch { }
  if (!code || !S.cap.db) return;
  S.mode = 'h2h'; S.h2h.stage = 'lobby'; S.h2h.joinCode = code;
  try { history.replaceState(null, '', location.pathname); } catch { }
  setTimeout(() => joinByCode(), 600);
}

</script>
