name: V2 research queue
on:
  push:
    branches: [develop/v2-option-c]
    paths: ['research/option-c/batches/**', 'tools/v2-research-pipeline.cjs', '.github/workflows/v2-research-queue.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: read
concurrency:
  group: v2-research-queue
  cancel-in-progress: false
jobs:
  next-batch:
    if: github.repository == 'garrettem-op/Draft_Anything'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v2-option-c
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect identities already claimed by open research PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          node - > "$RUNNER_TEMP/claimed.json" <<'NODE'
          const cp=require('child_process');
          const gh=a=>cp.execFileSync('gh',a,{encoding:'utf8',maxBuffer:64*1024*1024});
          const all=p=>JSON.parse(gh(['api','--paginate','--slurp',p])).flat();
          const repo=process.env.REPO,ids=new Set();
          for(const pr of all('/repos/'+repo+'/pulls?state=open&base=develop/v2-option-c&per_page=100')){
            for(const f of all('/repos/'+repo+'/pulls/'+pr.number+'/files?per_page=100')){
              if(!/^research\/option-c\/batches\/.*\.json$/.test(f.filename)||f.status==='removed')continue;
              try{
                const raw=gh(['api','-H','Accept: application/vnd.github.raw+json','/repos/'+repo+'/contents/'+encodeURI(f.filename)+'?ref='+pr.head.sha]);
                for(const c of JSON.parse(raw).characters||[])if(c&&typeof c.id==='string')ids.add(c.id);
              }catch(e){console.error('#'+pr.number+' '+f.filename+': unreadable, ignored ('+e.message.split('\n')[0]+')');}
            }
          }
          console.log(JSON.stringify([...ids]));
          NODE
          echo "Claimed by open PRs: $(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1])).length)' "$RUNNER_TEMP/claimed.json")"
      - name: Validate and choose next unassigned research batch
        id: next
        run: |
          node tools/v2-research-pipeline.cjs --validate
          node tools/v2-research-pipeline.cjs --next --claimed "$RUNNER_TEMP/claimed.json" > "$RUNNER_TEMP/next.json"
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.argv[1]));fs.appendFileSync(process.env.GITHUB_OUTPUT,'complete='+x.complete+'\n'+'pool='+(x.pool||'')+'\n')" "$RUNNER_TEMP/next.json"
      - name: Publish next research assignment
        if: steps.next.outputs.complete == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          node - "$RUNNER_TEMP/next.json" > "$RUNNER_TEMP/issue.md" <<'NODE'
          const fs=require('fs'),q=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log('Research the following exact roster identities. Only claim feats supported in this specific continuity; variants are separate.\n');
          console.log(q.ids.map(id=>'- `'+id+'`').join('\n'));
          console.log('\nOutput: validated JSON in `research/option-c/batches/` following docs/V2_RESEARCH_AUTOMATION.md. Use sources with claim-level support; leave unknowns unresolved. PR to `develop/v2-option-c`. Model work is manual/externally submitted until a free, authenticated worker is configured.');
          NODE
          # One open assignment at a time. Close assignments whose identities are all now merged
          # or claimed by an open PR, so the queue keeps moving without a human closing issues.
          for n in $(gh issue list -R "$REPO" --state open --search 'in:title "[V2 Research Queue]"' --json number,title --jq '.[]|select(.title|startswith("[V2 Research Queue]"))|.number'); do
            body="$(gh issue view "$n" -R "$REPO" --json body --jq .body)"
            if printf '%s' "$body" | node -e '
              const fs=require("fs");const body=fs.readFileSync(0,"utf8");
              const ids=[...body.matchAll(/^- `([^`]+)`$/gm)].map(m=>m[1]);
              const claimed=new Set(JSON.parse(fs.readFileSync(process.argv[1],"utf8")));
              const pipe=require(process.cwd()+"/tools/v2-research-pipeline.cjs");const a=pipe.audit();
              process.exit(ids.length&&ids.every(id=>a.records.has(id)||claimed.has(id))?0:1);' "$RUNNER_TEMP/claimed.json"; then
              gh issue close "$n" -R "$REPO" --comment 'All identities in this assignment are merged or claimed by an open PR. Closed by the V2 research queue.'
            fi
          done
          count="$(gh issue list -R "$REPO" --state open --search 'in:title "[V2 Research Queue]"' --json title --jq '[.[]|select(.title|startswith("[V2 Research Queue]"))]|length')"
          if [ "$count" -gt 0 ]; then echo 'An open research assignment exists; not duplicating.'; exit 0; fi
          gh issue create -R "$REPO" --title "[V2 Research Queue] Next ${{ steps.next.outputs.pool }} batch" --body-file "$RUNNER_TEMP/issue.md"
