name: Men's volleyball 50-match study
on:
  push:
    branches:
      - chatgpt/mens-vb-50-box-score-study
    paths:
      - scripts/mens_vb_box_score_study.py
      - tests/volleyball-score-audit.test.js
      - data/after-action.js
      - .github/workflows/mens-vb-study.yml
  pull_request:
    paths:
      - scripts/mens_vb_box_score_study.py
      - tests/volleyball-score-audit.test.js
      - data/after-action.js
      - .github/workflows/mens-vb-study.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: pip install requests beautifulsoup4
      - name: Extract and validate 50 original box scores
        run: python scripts/mens_vb_box_score_study.py
      - name: Verify simulator against empirical distribution
        run: node tests/volleyball-score-audit.test.js
      - name: Upload source audit and extracted data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mens-vb-2025-study
          path: data/research/mens-vb-*
          if-no-files-found: warn
      - name: Commit validated study data back to research branch
        if: success() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/mens-vb-*
          git diff --cached --quiet || git commit -m "Add validated 50-match men's volleyball scoring dataset"
          git push
