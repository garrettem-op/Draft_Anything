name: After-action regression tests
on:
  push:
    branches:
      - feature/per-match-box-scores
  pull_request:
    paths:
      - 'data/after-action.js'
      - 'data/campaign.js'
      - 'data/knowledge-engine.js'
      - 'supabase/**'
      - 'index.html'
      - 'data/character-abilities.js'
      - 'tests/**'
      - 'data/knowledge-engine.js'
      - 'supabase/**'
      - '.github/workflows/after-action-tests.yml'
jobs:
  box-scores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reports and score reconciliation
        run: node --test tests/*.test.cjs
  mobile-browser:
    # Playwright 1.57 supports Ubuntu 24.04; ubuntu-latest has advanced to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install chromium --with-deps
      - name: Verify real mobile Campaign flow
        run: node tests/browser-smoke.cjs
  knowledge-edge-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Edge Function TypeScript and imports
        run: deno check supabase/functions/character-knowledge/index.ts

  edge-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check AI research function
        run: deno check supabase/functions/character-knowledge/index.ts
