name: After-action regression tests
on:
  push:
    branches:
      - feature/per-match-box-scores
  pull_request:
jobs:
  box-scores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reports and score reconciliation
        run: node --test tests/*.test.cjs
      - name: Run volleyball sample regression
        run: node tests/volleyball-score-audit.test.js
  mobile-browser:
    # Playwright 1.57 supports Ubuntu 24.04; ubuntu-latest has advanced to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install chromium --with-deps
      - name: Verify real mobile Campaign flow
        run: node tests/browser-smoke.cjs
  knowledge-edge-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Edge Function TypeScript and imports
        run: deno check supabase/functions/character-knowledge/index.ts

  edge-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check AI research function
        run: deno check supabase/functions/character-knowledge/index.ts

  public-knowledge-health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public AI research readiness (no API costs)
        run: |
          node <<'NODE'
          const url='https://pbwpyzfgqdcmchfciqeu.supabase.co/functions/v1/character-knowledge?action=approved';
          async function main(){
            try {
              const response=await fetch(url,{signal:AbortSignal.timeout(12000)});
              let data={};try{data=await response.json();}catch{}
              console.log('Knowledge API HTTP status:',response.status);
              console.log('Live research ready:',data.research_ready===true);
              console.log('Approved knowledge records:',Array.isArray(data.facts)?data.facts.length:'unavailable');
              if(response.ok&&data.research_ready===true)console.log('HEALTH RESULT: CONFIGURED');
              else if(response.ok&&data.research_ready===false)console.log('HEALTH RESULT: SECRETS NOT FULLY CONFIGURED');
              else console.log('HEALTH RESULT: UNVERIFIED OR ERROR');
            }catch(e){console.log('HEALTH RESULT: UNREACHABLE — '+e.message)}
          }
          main();
          NODE
