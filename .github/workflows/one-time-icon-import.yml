name: One-time icon asset import
on:
  push:
    branches: [feat/home-screen-version1-logo-20261109]
    paths: ['.github/workflows/one-time-icon-import.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download selected DraftAnything crest
        env:
          ICON_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F472ab55f-c17c-427a-ab4e-2556b1b2088f/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAKBFDKSsLjIPVPPVcMndMWCY8WhxEw3JR4pNMB4s7mW3&exp=1794272704&osig=AAAAAAAAAAAAAAAAAAAAAEikAmBPdEWuEs50lnDnPeuITfuBWs2oOOBjokGjnC0f&signer=media-rpc&token=AAIAAU0AJDQ3MmFiNTVmLWMxN2MtNDI3YS1hYjRlLTI1NTZiMWIyMDg4ZgAAAAABocL8tgBw1ZglrImiHm5W9trG0qRskwf5_XnzMAqIci79Pq7JPw&x-canva-quality=thumbnail"
        run: |
          curl --fail --show-error --location --retry 2 "$ICON_URL" -o /tmp/source-icon.png
          file /tmp/source-icon.png
      - name: Create browser and mobile icons
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          im=Image.open('/tmp/source-icon.png').convert('RGB')
          assert im.width==im.height and im.width>=180, im.size
          Path('icons').mkdir(exist_ok=True)
          for size,name in [(180,'apple-touch-icon.png'),(192,'icon-192.png'),(512,'icon-512.png'),(32,'favicon-32.png')]:
              im.resize((size,size),Image.Resampling.LANCZOS).save('icons/'+name,optimize=True)
          im.resize((256,256),Image.Resampling.LANCZOS).save('favicon.ico',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          PY
      - name: Commit generated icon binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/*.png favicon.ico
          git diff --cached --quiet || (git commit -m "Add selected esports crest home-screen icon binaries" && git push origin HEAD:feat/home-screen-version1-logo-20261109)
