name: V2 reviewed research merge gate
# The gate logic (tools/v2-research-gate.cjs) is always checked out from the trusted base
# branch develop/v2-option-c, never from the PR. The gate itself fails closed: research JSON
# only, label present, a non-author non-bot APPROVED review on the current head, no change
# requests, and every other check on the head completed green (it waits up to ~10 min for
# running checks). It merges through the REST API pinned to the approved head SHA, so only that head can land.
#
# Caveat: pull_request_review has no *_target variant, so for that event GitHub uses the
# workflow YAML from the PR's merge commit. A PR that edits this YAML is itself ineligible
# (non-research file), but only branch protection/rulesets can stop a malicious same-repo
# edit. See docs/V2_RESEARCH_AUTOMATION.md.
on:
  pull_request_target:
    types: [labeled, synchronize, reopened, ready_for_review]
    branches: [develop/v2-option-c]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to evaluate'
        required: true
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: v2-research-gate-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false
jobs:
  research-merge-gate:
    if: github.repository == 'garrettem-op/Draft_Anything'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v2-option-c
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Evaluate and merge if eligible
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: node tools/v2-research-gate.cjs "$REPO" "$PR"
      - name: Continue the queue after a merge
        # Merges made with GITHUB_TOKEN do not fire push workflows, so dispatch explicitly.
        if: steps.gate.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run v2-research-queue.yml -R "$REPO" --ref develop/v2-option-c \
            || echo '::warning::Could not dispatch the research queue; run it manually or from a scheduled tick.'
