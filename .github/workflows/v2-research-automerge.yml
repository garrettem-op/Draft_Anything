name: V2 reviewed research auto-merge gate
# Uses trusted base-branch code only; never checks out or executes PR content.
# A human, non-author GitHub APPROVED review and explicit research approval label
# are both mandatory. GitHub repo also needs auto-merge and branch rules configured.
on:
  pull_request:
    types: [labeled, synchronize, reopened, ready_for_review]
    branches: [develop/v2-option-c]
  pull_request_review:
    types: [submitted]
permissions:
  contents: write
  pull-requests: write
jobs:
  gate:
    if: github.repository == 'garrettem-op/Draft_Anything'
    runs-on: ubuntu-latest
    steps:
      - name: Check explicit approval, files, and completed green checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          if [ -z "$PR" ]; then exit 0; fi
          node - <<'NODE'
          const cp=require('child_process');
          const repo=process.env.REPO,n=process.env.PR;
          const api=(u)=>JSON.parse(cp.execFileSync('gh',['api',u],{encoding:'utf8'}));
          const pr=api('/repos/'+repo+'/pulls/'+n);
          const stop=m=>{console.log('Not eligible for automatic merge: '+m);process.exit(0)};
          if(pr.base.ref!=='develop/v2-option-c'||pr.draft||pr.state!=='open')stop('not an open V2 review-ready PR');
          if(!pr.labels.some(l=>l.name==='v2-research-approved'))stop('approval label absent');
          const files=api('/repos/'+repo+'/pulls/'+n+'/files?per_page=100');
          if(files.length===0||files.length>=100)stop('no files or too many to verify');
          if(files.some(f=>f.status==='removed'||!/^research\/option-c\/batches\/[a-z0-9][a-z0-9_-]*\.json$/i.test(f.filename)))stop('changes extend outside research data JSON');
          const reviews=api('/repos/'+repo+'/pulls/'+n+'/reviews?per_page=100');
          const latest=new Map();for(const r of reviews){if(r.user?.login)latest.set(r.user.login,{state:r.state,at:r.submitted_at||''});}
          const approvers=[...latest].filter(([login,r])=>login!==pr.user.login&&r.state==='APPROVED');
          if(!approvers.length)stop('no independent approved review');
          const checks=api('/repos/'+repo+'/commits/'+pr.head.sha+'/check-runs?per_page=100');
          const all=checks.check_runs||[];
          const validations=all.filter(x=>x.name==='validate-research');
          if(!validations.some(x=>x.status==='completed'&&x.conclusion==='success'))stop('V2 research validation has not passed on this head');
          const failing=all.filter(x=>x.status==='completed'&&['failure','cancelled','timed_out','action_required'].includes(x.conclusion));
          if(failing.length)stop('head contains failing checks');
          console.log('Eligible for GitHub auto-merge request. Other branch protection and repository settings remain authoritative.');
          cp.execFileSync('gh',['pr','merge',String(n),'-R',repo,'--auto','--squash'],{stdio:'inherit'});
          NODE
